<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Paper background with a hairline rule border (the almanac page) -->
  <circle cx="256" cy="256" r="240" fill="#faf6f3" stroke="#d6c5ba" stroke-width="3"/>

  <!-- Amber dashed safety threshold across the middle -->
  <line x1="80" y1="280" x2="432" y2="280"
        stroke="#d4a657" stroke-width="6"
        stroke-dasharray="14 16" stroke-linecap="round"/>

  <!-- Forecast line in segments: green above threshold, red below.
       Segments split exactly at the threshold crossings so the rounded
       line caps meet cleanly. -->
  <g fill="none" stroke-width="28" stroke-linecap="round" stroke-linejoin="round">
    <!-- Green: opening climb to first threshold crossing (234, 280) -->
    <polyline points="100,230 190,180 234,280" stroke="#2e9764"/>
    <!-- Red: dip below the threshold and back up to (310, 280) -->
    <polyline points="234,280 270,360 310,280" stroke="#d04632"/>
    <!-- Green: recovery and finish -->
    <polyline points="310,280 350,200 420,240" stroke="#2e9764"/>
  </g>
</svg>
