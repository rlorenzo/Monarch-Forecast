name: Build Desktop Apps

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            platform: macos
            artifact: dmg
          - os: windows-latest
            platform: windows
            artifact: msix
          - os: ubuntu-latest
            platform: linux
            artifact: AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6.8.0

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2  # v2.9.1
        with:
          flutter-version: "3.41.7"
          channel: stable

      - name: Install Linux build deps
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev libayatana-appindicator3-dev

      - name: Install dependencies
        run: uv sync --frozen

      - name: Build for ${{ matrix.platform }}
        shell: bash
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        # --compile-app/--compile-packages ship .pyc instead of .py source,
        # and --cleanup-app/--cleanup-packages strip the leftover .py files,
        # tests, docs, and dist-info chaff from the bundled site-packages.
        # Together they trim the shipped .app / installer by ~20-30%.
        run: |
          BUILD_VERSION="${{ github.ref_name }}"
          BUILD_VERSION="${BUILD_VERSION#v}"
          # Manual dispatch (no tag) falls back to the version from
          # pyproject.toml so the build still succeeds.
          if [ -z "$BUILD_VERSION" ] || [ "$BUILD_VERSION" = "${{ github.ref_name }}" ]; then
            BUILD_VERSION=$(uv run python -c "import importlib.metadata; print(importlib.metadata.version('monarch-forecast'))")
          fi
          uv run flet build ${{ matrix.platform }} \
            --project "Monarch Forecast" \
            --org "com.monarchforecast" \
            --product "Monarch Forecast" \
            --description "Financial forecasting powered by Monarch Money" \
            --build-version "$BUILD_VERSION" \
            --compile-app \
            --compile-packages \
            --cleanup-app \
            --cleanup-packages

      - name: Package build
        shell: bash
        run: |
          cd build/${{ matrix.platform }}
          if [ "${{ matrix.platform }}" = "windows" ]; then
            7z a -tzip "../monarch-forecast-${{ matrix.platform }}.zip" .
          else
            tar -czf "../monarch-forecast-${{ matrix.platform }}.tar.gz" .
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: monarch-forecast-${{ matrix.platform }}
          path: |
            build/monarch-forecast-${{ matrix.platform }}.zip
            build/monarch-forecast-${{ matrix.platform }}.tar.gz
          if-no-files-found: ignore

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Extract release notes from CHANGELOG.md
        id: notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # First awk slices the CHANGELOG section; second awk unwraps
          # hard line breaks within paragraphs and bullets so GitHub
          # renders them flowing at its own width.
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" {flag=1; next}
            /^## \[/ && flag {exit}
            flag {print}
          ' CHANGELOG.md | awk '
            function flush() { if (buf != "") { print buf; buf = "" } }
            /^$/ { flush(); print; next }
            /^#/ { flush(); print; next }
            /^- / { flush(); buf = $0; next }
            /^[[:space:]]+/ { sub(/^[[:space:]]+/, ""); buf = (buf == "") ? $0 : buf " " $0; next }
            { buf = (buf == "") ? $0 : buf " " $0 }
            END { flush() }
          ' > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "No CHANGELOG.md section found for $VERSION" >&2
            exit 1
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2.6.2
        with:
          files: |
            artifacts/**/*.zip
            artifacts/**/*.tar.gz
          body_path: release-notes.md
          draft: true
