name: Build Desktop Apps

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# Build jobs only need to read the repo; the release job below escalates
# to contents: write for itself (least privilege — a compromised build
# step must not be able to push releases or rewrite repo contents).
permissions:
  contents: read

jobs:
  build:
    strategy:
      # Keep all three platforms running independently so one platform's
      # build/smoke failure doesn't mask issues on the others — debugging
      # one mystery at a time is slower than seeing all three at once.
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos
            artifact: dmg
          - os: windows-latest
            platform: windows
            artifact: msix
          - os: ubuntu-latest
            platform: linux
            artifact: AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990  # v8.3.2

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2  # v2.23.0
        with:
          flutter-version: "3.41.7"
          channel: stable

      - name: Install Linux build deps
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev libayatana-appindicator3-dev

      - name: Install dependencies
        run: uv sync --frozen

      - name: Build for ${{ matrix.platform }}
        shell: bash
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        # --compile-app/--compile-packages ship .pyc instead of .py source.
        # The --cleanup-* flags strip the leftover .py / tests / dist-info
        # chaff afterwards, trimming the installer by ~20-30% — but on
        # Linux they also strip Python stdlib C extensions like
        # lib-dynload/_socket.*.so, which the embedded interpreter loads
        # at runtime. Without _socket, ``import socket`` raises
        # ModuleNotFoundError before Flet builds its widget tree (the
        # window opens with a painted background and nothing else). Keep
        # the cleanup on macOS/Windows where it works correctly; skip it
        # on Linux until Flet ships a fix for the over-aggressive prune.
        run: |
          BUILD_VERSION="${{ github.ref_name }}"
          BUILD_VERSION="${BUILD_VERSION#v}"
          # Manual dispatch (no tag) falls back to the version from
          # pyproject.toml so the build still succeeds.
          if [ -z "$BUILD_VERSION" ] || [ "$BUILD_VERSION" = "${{ github.ref_name }}" ]; then
            BUILD_VERSION=$(uv run python -c "import importlib.metadata; print(importlib.metadata.version('monarch-forecast'))")
          fi
          CLEANUP_FLAGS="--cleanup-app --cleanup-packages"
          if [ "${{ matrix.platform }}" = "linux" ]; then
            CLEANUP_FLAGS=""
          fi
          # Keep build/dev cruft OUT of the bundled app.zip. Without this,
          # `flet build` sweeps the ENTIRE project directory into app.zip:
          # the uv-created .venv (a ~55 MB virtualenv whose unsigned Mach-O
          # binaries make macOS notarization fail outright — see
          # packaging/macos/README.md), the full .git history, the test
          # suite, screenshots, etc. The runtime only needs src/ + main and
          # the assets Flet references; dependencies ship separately in the
          # embedded python.bundle, NOT from this .venv. Excluding these also
          # trims the installer by tens of MB on every platform.
          EXCLUDES="--exclude .venv .git tests .github screenshots design web packaging"
          uv run flet build ${{ matrix.platform }} \
            --project "Monarch Forecast" \
            --org "com.monarchforecast" \
            --product "Monarch Forecast" \
            --description "Financial forecasting powered by Monarch Money" \
            --build-version "$BUILD_VERSION" \
            --compile-app \
            --compile-packages \
            $EXCLUDES \
            $CLEANUP_FLAGS

      - name: Patch Linux bundle stdlib C extensions
        if: matrix.platform == 'linux'
        shell: bash
        # Flet 0.85.1's Linux bundle ships only a handful of stdlib
        # C extensions (_dbm, _tkinter, _crypt) in python3.12/
        # lib-dynload — _socket, _ssl, _hashlib, _decimal, zlib, and
        # most of the rest are missing. ``import socket`` then raises
        # ModuleNotFoundError before Flet builds its widget tree, so
        # the window opens with a painted background and nothing else.
        #
        # Flet's runtime adds ``build/linux/python3.12`` to the import
        # path but NOT ``python3.12/lib-dynload``, so dropping the .so
        # files in lib-dynload doesn't help. They have to land flat
        # alongside socket.pyc (i.e. in ``python3.12/`` itself).
        #
        # Copy the missing .so files from the runner's CPython 3.12
        # (set up by actions/setup-python; same minor version ⇒
        # C-ABI compatible) into ``python3.12/`` and ``site-packages/``
        # for belt-and-suspenders. Bloats the artifact by ~10-15 MB.
        # Remove this step once Flet upstream ships a complete bundle.
        run: |
          BUNDLE_PY="build/linux/python3.12"
          BUNDLE_SP="build/linux/site-packages"
          if [ ! -d "$BUNDLE_PY" ]; then
            echo "::error::Expected $BUNDLE_PY to exist after flet build linux"
            exit 1
          fi
          RUNNER_LD="$(python3 -c 'import sysconfig, pathlib; print(pathlib.Path(sysconfig.get_paths()["stdlib"]) / "lib-dynload")')"
          if [ ! -d "$RUNNER_LD" ]; then
            echo "::error::Runner Python lib-dynload not found at $RUNNER_LD"
            exit 1
          fi
          echo "Runner lib-dynload: $(ls "$RUNNER_LD"/*.so | wc -l) .so files"
          echo "Bundle python3.12 .so (before): $(find "$BUNDLE_PY" -maxdepth 1 -name '*.so' | wc -l)"
          # cp -n so we don't overwrite anything Flet already shipped.
          cp -n "$RUNNER_LD"/*.so "$BUNDLE_PY"/ 2>/dev/null || true
          cp -n "$RUNNER_LD"/*.so "$BUNDLE_PY/lib-dynload"/ 2>/dev/null || true
          if [ -d "$BUNDLE_SP" ]; then
            cp -n "$RUNNER_LD"/*.so "$BUNDLE_SP"/ 2>/dev/null || true
          fi
          echo "Bundle python3.12 .so (after): $(find "$BUNDLE_PY" -maxdepth 1 -name '*.so' | wc -l)"
          if ! ls "$BUNDLE_PY"/_socket*.so >/dev/null 2>&1; then
            echo "::error::_socket still missing in $BUNDLE_PY after patch"
            exit 1
          fi
          echo "_socket landed at: $(ls "$BUNDLE_PY"/_socket*.so)"

      - name: Install Linux smoke-test deps
        if: matrix.platform == 'linux'
        # ``libgl1-mesa-dri`` ships llvmpipe (Mesa's software rasterizer);
        # without it, Flutter's EGL/GL init fails under Xvfb and the
        # window renders pure black even though the process stays alive.
        run: sudo apt-get install -y xvfb imagemagick libgl1-mesa-dri

      - name: Install Pillow for smoke screenshot check
        if: matrix.platform != 'windows'
        # Pinned so a future Pillow release can't independently break a
        # tagged build. Bump deliberately when refreshing the smoke tool.
        run: python3 -m pip install --user --quiet 'pillow==12.2.0'

      # Secrets can't be referenced in `if:` expressions, so surface a boolean
      # output instead. When the signing secrets are absent (e.g. a manual
      # dispatch before they're configured), signing is skipped and the job
      # falls back to an unsigned tarball rather than failing outright.
      - name: Detect macOS signing secrets
        id: macsign
        if: matrix.platform == 'macos'
        env:
          CERT: ${{ secrets.MACOS_CERT_P12 }}
        run: |
          if [ -n "$CERT" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::macOS signing secrets not set — shipping an UNSIGNED, un-notarized build."
          fi

      # Signs every nested binary with the Developer ID cert + hardened runtime,
      # builds a DMG, submits it to Apple's notary service, and staples the
      # ticket — all via packaging/macos/sign_notarize.sh (the exact script used
      # for local releases). The cert is imported into a throwaway keychain that
      # dies with the runner. Runs BEFORE the smoke test so the smoke test
      # exercises the actual signed, hardened-runtime artifact we ship.
      - name: Sign & notarize (macOS)
        if: matrix.platform == 'macos' && steps.macsign.outputs.enabled == 'true'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PW="$(uuidgen)"
          CERT_P12="$RUNNER_TEMP/cert.p12"
          NOTARY_P8="$RUNNER_TEMP/AuthKey.p8"

          # Throwaway keychain holding just the Developer ID identity.
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          printf '%s' "$MACOS_CERT_P12" | base64 --decode > "$CERT_P12"
          security import "$CERT_P12" -P "$MACOS_CERT_PASSWORD" \
            -t cert -f pkcs12 -k "$KEYCHAIN" \
            -T /usr/bin/codesign -T /usr/bin/security
          # Let codesign use the key non-interactively (the same partition-list
          # fix required on a dev Mac, applied to this ephemeral keychain).
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PW" "$KEYCHAIN" >/dev/null
          # Make the keychain visible to find-identity / codesign.
          security list-keychains -d user -s "$KEYCHAIN" "login.keychain-db"

          printf '%s' "$NOTARY_KEY_P8" > "$NOTARY_P8"

          # Wipe secret material on ANY exit from this step, including a
          # signing/notarization failure (`set -e` would otherwise abort
          # before a trailing rm ever ran).
          trap 'rm -f "$CERT_P12" "$NOTARY_P8"' EXIT

          SIGN_IDENTITY="$MACOS_SIGN_IDENTITY" \
          NOTARY_KEY="$NOTARY_P8" \
          NOTARY_KEY_ID="$NOTARY_KEY_ID" \
          NOTARY_ISSUER="$NOTARY_ISSUER" \
            ./packaging/macos/sign_notarize.sh

      # Launches the built binary in demo mode (MONARCH_FORECAST_AUTO_DEMO=1
      # short-circuits to the demo dashboard — see src/main.py) and verifies
      # that:
      #   1. The process stays alive for at least 12 seconds. Catches silent
      #      crashes — e.g. an entry-point wrapper that imports ``main`` but
      #      never calls ``ft.run``, which is how the 1.0.0 release shipped
      #      a binary that "opened and then closed" with no stderr.
      #   2. The window actually rendered something — captured by screenshot
      #      and a "distinct color count" check. A blank window (uniform
      #      background, missing fonts, white-on-white render bug) fails.
      #
      # Windows is skipped because GitHub Actions windows runners don't
      # reliably expose an interactive desktop session for GUI processes.
      - name: Launch smoke test
        if: matrix.platform != 'windows'
        shell: bash
        env:
          MONARCH_FORECAST_AUTO_DEMO: "1"
          # Force Mesa software rendering on Linux. The GitHub-hosted
          # Xvfb has no DRI3/hardware GL, so Flutter's EGL init falls
          # through to nothing and the window paints solid black. With
          # llvmpipe forced on, GL works and Flutter actually renders.
          LIBGL_ALWAYS_SOFTWARE: "1"
          GALLIUM_DRIVER: "llvmpipe"
        run: |
          set -u
          mkdir -p /tmp/smoke-artifacts
          APP_PID=
          XVFB_PID=
          # Tear down background processes no matter how the step exits
          # (success, ``exit 1`` from a failed assertion, or a trap from
          # set -e). Without this every early ``exit 1`` below would leak
          # the app + Xvfb until the runner VM was destroyed, which would
          # also hold open ports and log handles during the artifact-
          # upload phase.
          cleanup() {
            [ -n "$APP_PID" ] && kill "$APP_PID" 2>/dev/null || true
            pkill -f 'Monarch Forecast' 2>/dev/null || true
            pkill -f monarch_forecast 2>/dev/null || true
            [ -n "$XVFB_PID" ] && kill "$XVFB_PID" 2>/dev/null || true
            return 0
          }
          trap cleanup EXIT
          cd build/${{ matrix.platform }}
          case "${{ matrix.platform }}" in
            macos)
              BINARY="Monarch Forecast.app/Contents/MacOS/Monarch Forecast"
              [ -x "$BINARY" ] || { echo "::error::macOS binary not found at $BINARY"; ls -la; exit 1; }
              "$BINARY" > /tmp/smoke-artifacts/smoke.log 2>&1 &
              APP_PID=$!
              ;;
            linux)
              BINARY="$(find . -maxdepth 4 -type f -name 'monarch_forecast' -perm -u+x | head -1)"
              if [ -z "$BINARY" ]; then
                BINARY="$(find . -maxdepth 4 -type f -name 'Monarch Forecast' -perm -u+x | head -1)"
              fi
              [ -n "$BINARY" ] || { echo "::error::Linux binary not found"; find . -maxdepth 4 -type f -perm -u+x; exit 1; }
              echo "Launching: $BINARY"
              # Manual Xvfb so we can screenshot the same display the app
              # renders into. ``xvfb-run`` auto-allocates a display, but
              # then we'd have to chase down its number to screenshot it.
              Xvfb :99 -screen 0 1280x900x24 > /tmp/smoke-artifacts/xvfb.log 2>&1 &
              XVFB_PID=$!
              export DISPLAY=:99
              sleep 2
              "$BINARY" > /tmp/smoke-artifacts/smoke.log 2>&1 &
              APP_PID=$!
              ;;
          esac

          # Initial boot grace — the window doesn't exist for the first
          # second or two, so screenshotting immediately wastes a poll.
          sleep 5

          # Distinct-color check, written once and reused by the poll
          # loop below. A real rendered Flet window with antialiased text
          # and a chart easily has thousands of distinct RGB values; a
          # blank/uniform-background failure has under a dozen. 50 is a
          # conservative threshold that distinguishes the two cleanly.
          # ``maxcolors=50`` short-circuits the moment we know there are
          # enough — Image.getcolors returns None once the count exceeds
          # maxcolors, which is exactly our pass condition.
          cat > /tmp/check_render.py <<'PY'
          import sys
          from PIL import Image
          try:
              img = Image.open("/tmp/smoke-artifacts/screen.png").convert("RGB")
          except Exception as exc:
              print(f"could not read screenshot: {exc}")
              sys.exit(2)
          colors = img.getcolors(maxcolors=50)
          if colors is None:
              print(f"rendered ({img.size})")
              sys.exit(0)
          print(f"{len(colors)} distinct colors so far ({img.size})")
          sys.exit(1)
          PY

          # Poll: screenshot every few seconds and accept the smoke test
          # as soon as the window has enough distinct colors to be
          # plausibly rendered. macOS hardware GL produces a full frame
          # in under one poll; Linux llvmpipe (software GL) can take
          # 20-40s, so the budget is conservative. Healthy builds still
          # finish in ~10s because we exit early on success.
          MAX_WAIT=60
          INTERVAL=4
          ELAPSED=0
          while true; do
            if ! kill -0 "$APP_PID" 2>/dev/null; then
              echo "::error::Built binary exited before smoke render check (t=${ELAPSED}s)."
              echo "--- captured output ---"
              cat /tmp/smoke-artifacts/smoke.log || true
              exit 1
            fi

            # Screenshot the rendered window. On macOS we capture only
            # the app's window region — capturing the whole screen would
            # falsely pass the pixel check because the runner's desktop
            # wallpaper alone has thousands of distinct colors. On Linux
            # the Xvfb display only contains our app, so the full-display
            # capture is the right call there.
            case "${{ matrix.platform }}" in
              macos)
                osascript -e 'tell application "Monarch Forecast" to activate' >/dev/null 2>&1 || true
                BOUNDS=$(osascript -e 'tell application "System Events" to tell process "Monarch Forecast" to get {position, size} of window 1' 2>&1 || true)
                if echo "$BOUNDS" | grep -qE '^[0-9]+, *[0-9]+, *[0-9]+, *[0-9]+'; then
                  REGION=$(echo "$BOUNDS" | tr -d ' ')
                  screencapture -x -R "$REGION" /tmp/smoke-artifacts/screen.png 2>/dev/null || true
                fi
                ;;
              linux)
                import -window root /tmp/smoke-artifacts/screen.png 2>/dev/null || true
                ;;
            esac

            if python3 /tmp/check_render.py; then
              echo "Smoke test passed at t=${ELAPSED}s: process alive + window rendered."
              exit 0
            fi

            if [ $ELAPSED -ge $MAX_WAIT ]; then
              echo "::error::Window never rendered within ${MAX_WAIT}s — fewer than 50 distinct colors in the final screenshot."
              echo "--- captured output ---"
              cat /tmp/smoke-artifacts/smoke.log || true
              exit 1
            fi

            sleep $INTERVAL
            ELAPSED=$((ELAPSED + INTERVAL))
          done
          # ``cleanup`` (registered via trap above) handles teardown for
          # both the success and the early-``exit 1`` paths.

      - name: Upload smoke-test artifacts on failure
        if: failure() && matrix.platform != 'windows'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: smoke-failure-${{ matrix.platform }}
          path: /tmp/smoke-artifacts/
          if-no-files-found: ignore

      - name: Package build
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" = "windows" ]; then
            (cd build/windows && 7z a -tzip "../monarch-forecast-windows.zip" .)
          elif [ "${{ matrix.platform }}" = "macos" ] && [ -f "build/Monarch Forecast.dmg" ]; then
            # Notarized DMG from the signing step — ship it directly (no tar).
            cp "build/Monarch Forecast.dmg" "build/monarch-forecast-macos.dmg"
          else
            # Linux, or macOS with signing disabled (no secrets): unsigned tar.
            (cd "build/${{ matrix.platform }}" && tar -czf "../monarch-forecast-${{ matrix.platform }}.tar.gz" .)
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: monarch-forecast-${{ matrix.platform }}
          path: |
            build/monarch-forecast-${{ matrix.platform }}.zip
            build/monarch-forecast-${{ matrix.platform }}.tar.gz
            build/monarch-forecast-macos.dmg
          if-no-files-found: ignore

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write  # create the draft GitHub release
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          path: artifacts/

      - name: Extract release notes from CHANGELOG.md
        id: notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # First awk slices the CHANGELOG section; second awk unwraps
          # hard line breaks within paragraphs and bullets so GitHub
          # renders them flowing at its own width.
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" {flag=1; next}
            /^## \[/ && flag {exit}
            flag {print}
          ' CHANGELOG.md | awk '
            function flush() { if (buf != "") { print buf; buf = "" } }
            /^$/ { flush(); print; next }
            /^#/ { flush(); print; next }
            /^- / { flush(); buf = $0; next }
            /^[[:space:]]+/ { sub(/^[[:space:]]+/, ""); buf = (buf == "") ? $0 : buf " " $0; next }
            { buf = (buf == "") ? $0 : buf " " $0 }
            END { flush() }
          ' > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "No CHANGELOG.md section found for $VERSION" >&2
            exit 1
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228  # v3.0.2
        with:
          files: |
            artifacts/**/*.zip
            artifacts/**/*.tar.gz
            artifacts/**/*.dmg
          body_path: release-notes.md
          draft: true
