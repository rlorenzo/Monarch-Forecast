# commit-msg included so `pre-commit install` also wires the trailer
# stripper below without a separate --hook-type flag.
default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.9
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: strip-ai-session-trailers
        name: strip AI session trailers from commit message
        # AI coding tools (Claude Code, and potentially others) append
        # session-link trailers to commit messages. This repo doesn't want
        # them; silently strip rather than fail the commit.
        entry: python3 -c 'import re,sys,pathlib; p=pathlib.Path(sys.argv[1]); t=p.read_text(); n=re.sub(r"(?mi)^(Claude-Session|Co-Authored-By. Claude|X-Codex-Session).*\n?", "", t); _ = p.write_text(n) if n != t else None'
        language: system
        stages: [commit-msg]
      - id: ty
        name: ty (type check)
        entry: uv run ty check
        language: system
        types: [python]
        pass_filenames: false
        verbose: true
      - id: vulture
        name: vulture (dead code)
        entry: uv run vulture
        language: system
        types: [python]
        pass_filenames: false
        verbose: true
      - id: tach
        name: tach (module boundaries)
        entry: uv run tach check
        language: system
        types: [python]
        pass_filenames: false
        verbose: true
      - id: bandit
        name: bandit (security scan, medium+)
        entry: uv run bandit -r -ll src
        language: system
        types: [python]
        pass_filenames: false
        verbose: true
      - id: jscpd
        name: jscpd (copy-paste detection)
        entry: jscpd
        args: [src]
        language: node
        additional_dependencies: ["jscpd@5.0.11"]
        types: [python]
        pass_filenames: false
        verbose: true
